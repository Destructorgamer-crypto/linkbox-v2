<!DOCTYPE html>
<html lang="es" data-theme="dark" data-mode="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-main-title">Aesthetic Launchpad</title>
    <!-- Favicon dinámico predeterminado -->
    <link id="dynamic-favicon" rel="icon" href="https://www.google.com/s2/favicons?domain=github.com&sz=64">
    <style>
        /* --- VARIABLES DE TEMAS Y PERSONALIZACIÓN DINÁMICA --- */
        :root {
            --transition-speed: 0.4s;
            --card-radius: 20px;
            --glow-effect: 0 15px 30px rgba(0, 0, 0, 0.25), 0 0 20px var(--accent-glow);
        }

        /* Desactivar neón si se prefiere plano */
        :root[data-neon="off"] {
            --glow-effect: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        /* Tema: Dark Space */
        :root[data-theme="dark"][data-mode="dark"] {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-bg: rgba(30, 41, 59, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --card-hover: rgba(51, 65, 85, 0.85);
        }
        :root[data-theme="dark"][data-mode="light"] {
            --bg-gradient: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(0, 0, 0, 0.08);
            --text-main: #0f172a;
            --text-muted: #475569;
            --accent: #4f46e5;
            --accent-glow: rgba(79, 70, 229, 0.25);
            --card-hover: rgba(255, 255, 255, 1);
        }

        /* Tema: Cyber Neon */
        :root[data-theme="neon"][data-mode="dark"] {
            --bg-gradient: linear-gradient(135deg, #050505 0%, #12001a 100%);
            --glass-bg: rgba(20, 20, 30, 0.8);
            --glass-border: rgba(236, 72, 153, 0.3);
            --text-main: #fff;
            --text-muted: #cbd5e1;
            --accent: #ec4899;
            --accent-glow: rgba(236, 72, 153, 0.6);
            --card-hover: rgba(35, 30, 50, 0.9);
        }
        :root[data-theme="neon"][data-mode="light"] {
            --bg-gradient: linear-gradient(135deg, #fce7f3 0%, #fae8ff 100%);
            --glass-bg: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(236, 72, 153, 0.2);
            --text-main: #701a75;
            --text-muted: #86198f;
            --accent: #db2777;
            --accent-glow: rgba(219, 39, 119, 0.3);
            --card-hover: rgba(255, 255, 255, 1);
        }

        /* Tema: Clean Minimal */
        :root[data-theme="minimal"][data-mode="dark"] {
            --bg-gradient: linear-gradient(135deg, #121212 0%, #1e1e1e 100%);
            --glass-bg: rgba(30, 30, 30, 0.8);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-main: #e5e5e5;
            --text-muted: #a3a3a3;
            --accent: #262626;
            --accent-glow: rgba(255, 255, 255, 0.15);
            --card-hover: rgba(45, 45, 45, 0.9);
        }
        :root[data-theme="minimal"][data-mode="light"] {
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            --glass-bg: rgba(255, 255, 255, 0.95);
            --glass-border: rgba(0, 0, 0, 0.06);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #0284c7;
            --accent-glow: rgba(2, 132, 199, 0.2);
            --card-hover: rgba(255, 255, 255, 1);
        }

        /* Tema: Sunset Vibes */
        :root[data-theme="sunset"][data-mode="dark"] {
            --bg-gradient: linear-gradient(135deg, #2a0845 0%, #6441a5 100%);
            --glass-bg: rgba(50, 30, 70, 0.75);
            --glass-border: rgba(255, 150, 150, 0.2);
            --text-main: #fff5f5;
            --text-muted: #f3cbd3;
            --accent: #ff758c;
            --accent-glow: rgba(255, 117, 140, 0.5);
            --card-hover: rgba(70, 45, 95, 0.85);
        }
        :root[data-theme="sunset"][data-mode="light"] {
            --bg-gradient: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 100%);
            --glass-bg: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(255, 117, 140, 0.3);
            --text-main: #581c87;
            --text-muted: #7e22ce;
            --accent: #e11d48;
            --accent-glow: rgba(225, 29, 72, 0.25);
            --card-hover: rgba(255, 255, 255, 1);
        }

        /* --- ESTILOS GENERALES --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            transition: background var(--transition-speed) ease, color var(--transition-speed) ease;
        }

        header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            animation: slideDown 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px var(--accent-glow);
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            border-radius: 6px;
        }

        h1:hover {
            opacity: 0.85;
            transform: scale(1.01);
        }

        .header-controls {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .theme-selector select, .control-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 12px;
            outline: none;
            cursor: pointer;
            backdrop-filter: blur(16px);
            transition: 0.3s;
        }

        .theme-selector select:hover, .control-btn:hover {
            border-color: var(--accent);
            transform: translateY(-2px) scale(1.03);
        }

        .control-btn {
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            padding: 0;
        }

        /* --- FORMULARIO --- */
        .card-form {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(16px);
            padding: 1.5rem;
            border-radius: var(--card-radius);
            width: 100%;
            max-width: 900px;
            display: flex;
            gap: 1rem;
            margin-bottom: 2.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            animation: fadeInScale 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            transition: border-radius var(--transition-speed);
        }

        .card-form input {
            flex: 1;
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid var(--glass-border);
            padding: 0.75rem 1rem;
            border-radius: 12px;
            color: var(--text-main);
            outline: none;
            font-size: 0.95rem;
            transition: 0.3s;
        }

        .card-form input::placeholder {
            color: var(--text-muted);
        }

        .card-form input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
            transform: scale(1.01);
        }

        .card-form button {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .card-form button:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        /* --- GRID DE ACCESOS --- */
        .grid-container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 1.5rem;
        }

        .shortcut-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(16px);
            border-radius: var(--card-radius);
            padding: 1.1rem 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-main);
            position: relative;
            overflow: hidden;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s, border-color 0.3s, box-shadow 0.3s;
            animation: cardPopIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
        }

        .shortcut-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
            transition: 0.5s;
        }

        .shortcut-card:hover::before {
            left: 100%;
        }

        .shortcut-card:hover {
            transform: translateY(-8px) scale(1.05);
            background: var(--card-hover);
            border-color: var(--accent);
            box-shadow: var(--glow-effect);
        }

        .shortcut-icon-wrapper {
            width: 52px;
            height: 52px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: calc(var(--card-radius) - 6px);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
            transition: transform 0.3s ease;
        }

        .shortcut-card:hover .shortcut-icon-wrapper {
            transform: rotate(6deg) scale(1.12);
        }

        .shortcut-card img {
            width: 30px;
            height: 30px;
            object-fit: contain;
            border-radius: 4px;
        }

        .shortcut-title {
            font-size: 0.85rem;
            font-weight: 500;
            text-align: center;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 0.5rem;
        }

        /* --- MENÚ CONTEXTUAL --- */
        #context-menu {
            display: none;
            position: absolute;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 1000;
            padding: 0.4rem;
            min-width: 140px;
            animation: popInMenu 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .menu-item {
            padding: 0.5rem 0.75rem;
            font-size: 0.85rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, transform 0.1s;
            color: var(--text-main);
        }

        .menu-item:hover {
            background: var(--accent);
            color: #fff;
            transform: translateX(3px);
        }

        .menu-item.delete:hover {
            background: #ef4444;
        }

        /* --- MODALES GENERALES --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.25s ease;
        }

        .modal-content {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(25px);
            padding: 2rem;
            border-radius: var(--card-radius);
            width: 90%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
            animation: scaleUpModal 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            color: var(--text-main);
        }

        .modal-content h3 {
            font-size: 1.25rem;
        }

        .modal-content input, .modal-content select {
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid var(--glass-border);
            padding: 0.75rem 1rem;
            border-radius: 12px;
            color: var(--text-main);
            outline: none;
            font-size: 0.95rem;
        }

        .modal-content input::placeholder {
            color: var(--text-muted);
        }

        .modal-content input:focus {
            border-color: var(--accent);
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .modal-buttons {
            display: flex;
            gap: 0.75rem;
            margin-top: 0.5rem;
        }

        .modal-buttons button {
            flex: 1;
            padding: 0.75rem;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-save {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-cancel {
            background: rgba(128,128,128,0.2);
            color: var(--text-main);
        }

        .modal-buttons button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* --- ANIMACIONES EXTRA --- */
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.92) translateY(-10px); }
            to { opacity: 1; transform: scale(1); translateY(0); }
        }

        @keyframes cardPopIn {
            0% { opacity: 0; transform: scale(0.7) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes popInMenu {
            from { opacity: 0; transform: scale(0.9) translateY(-5px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes scaleUpModal {
            from { opacity: 0; transform: scale(0.85) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        @media (max-width: 600px) {
            .card-form {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1 id="mainTitleDisplay" onclick="changeAppTitle()" title="Haz clic para editar el título">
            <img id="headerFavicon" src="" alt="Logo" style="display: none;">
            <span id="titleText">Aesthetic Launchpad</span>
        </h1>
        <div class="header-controls">
            <div class="theme-selector">
                <select id="themeSelect" onchange="changeTheme(this.value)">
                    <option value="dark">Dark Space</option>
                    <option value="neon">Cyber Neon</option>
                    <option value="minimal">Clean Minimal</option>
                    <option value="sunset">Sunset Vibes</option>
                </select>
            </div>
            <button class="control-btn" onclick="openSettingsModal()" title="Personalización Avanzada">⚙️</button>
            <button class="control-btn" id="modeBtn" onclick="toggleMode()" title="Cambiar Modo Claro/Oscuro">🌙</button>
        </div>
    </header>

    <!-- Formulario para añadir -->
    <div class="card-form">
        <input type="text" id="siteName" placeholder="Nombre personalizado (ej. Mi Web)">
        <input type="text" id="siteUrl" placeholder="Enlace (ej. https://ejemplo.com)">
        <button onclick="addShortcut()">Añadir</button>
    </div>

    <!-- Contenedor de Botones -->
    <div class="grid-container" id="gridContainer"></div>

    <!-- Menú contextual (Clic Derecho) -->
    <div id="context-menu">
        <div class="menu-item" onclick="openEditModal()">Editar Web...</div>
        <div class="menu-item delete" onclick="deleteShortcut()">Eliminar</div>
    </div>

    <!-- Modal de Edición de Acceso Directo -->
    <div id="edit-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Editar Acceso Directo</h3>
            <input type="text" id="editName" placeholder="Nuevo nombre personalizado">
            <input type="text" id="editUrl" placeholder="Nuevo enlace">
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeEditModal()">Cancelar</button>
                <button class="btn-save" onclick="saveEdit()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal de Personalización Avanzada -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Ajustes Aesthetic</h3>
            <div class="setting-group">
                <label>Redondeo de Tarjetas (Bordes)</label>
                <select id="radiusSetting" onchange="updateCustomization()">
                    <option value="12px">Sutil (12px)</option>
                    <option value="20px">Moderno (20px)</option>
                    <option value="32px">Redondo (32px)</option>
                    <option value="50px">Cápsula (50px)</option>
                </select>
            </div>
            <div class="setting-group">
                <label>Efecto de Neón en Tarjetas</label>
                <select id="neonSetting" onchange="updateCustomization()">
                    <option value="on">Activado (Brillo activo)</option>
                    <option value="off">Desactivado (Plano)</option>
                </select>
            </div>
            <div class="setting-group">
                <label>Enlace del Logotipo Personalizado (Favicon)</label>
                <input type="text" id="customFaviconInput" placeholder="https://ejemplo.com/logo.png" oninput="updateCustomization()">
            </div>
            <div class="modal-buttons">
                <button class="btn-save" onclick="closeSettingsModal()">¡Listo!</button>
            </div>
        </div>
    </div>

    <script>
        let shortcuts = JSON.parse(localStorage.getItem('aesthetic_shortcuts_v4')) || [];
        let currentTargetId = null;

        // Cargar preferencias guardadas
        const savedTheme = localStorage.getItem('aesthetic_theme') || 'dark';
        const savedMode = localStorage.getItem('aesthetic_mode') || 'dark';
        const savedTitle = localStorage.getItem('aesthetic_app_title') || 'Aesthetic Launchpad';
        const savedRadius = localStorage.getItem('aesthetic_radius') || '20px';
        const savedNeon = localStorage.getItem('aesthetic_neon') || 'on';
        const savedFavicon = localStorage.getItem('aesthetic_custom_favicon') || '';

        document.documentElement.setAttribute('data-theme', savedTheme);
        document.documentElement.setAttribute('data-mode', savedMode);
        document.documentElement.style.setProperty('--card-radius', savedRadius);
        document.documentElement.setAttribute('data-neon', savedNeon);

        document.getElementById('themeSelect').value = savedTheme;
        document.getElementById('titleText').textContent = savedTitle;
        document.getElementById('page-main-title').textContent = savedTitle;
        document.getElementById('radiusSetting').value = savedRadius;
        document.getElementById('neonSetting').value = savedNeon;
        document.getElementById('customFaviconInput').value = savedFavicon;

        applyFavicon(savedFavicon);
        updateModeButtonIcon(savedMode);

        function changeTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('aesthetic_theme', theme);
        }

        function toggleMode() {
            const currentMode = document.documentElement.getAttribute('data-mode');
            const newMode = currentMode === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-mode', newMode);
            localStorage.setItem('aesthetic_mode', newMode);
            updateModeButtonIcon(newMode);
        }

        function updateModeButtonIcon(mode) {
            document.getElementById('modeBtn').textContent = mode === 'dark' ? '🌙' : '☀️';
        }

        function applyFavicon(url) {
            const headerImg = document.getElementById('headerFavicon');
            const dynamicFavicon = document.getElementById('dynamic-favicon');
            
            if (url && url.trim() !== '') {
                headerImg.src = url;
                headerImg.style.display = 'inline-block';
                dynamicFavicon.href = url;
            } else {
                headerImg.style.display = 'none';
                dynamicFavicon.href = 'https://www.google.com/s2/favicons?domain=github.com&sz=64';
            }
        }

        function changeAppTitle() {
            const newTitle = prompt("Introduce el nuevo nombre para tu Launchpad:", document.getElementById('titleText').textContent);
            if (newTitle !== null && newTitle.trim() !== "") {
                const cleanTitle = newTitle.trim();
                document.getElementById('titleText').textContent = cleanTitle;
                document.getElementById('page-main-title').textContent = cleanTitle;
                localStorage.setItem('aesthetic_app_title', cleanTitle);
            }
        }

        function openSettingsModal() {
            document.getElementById('settings-modal').style.display = 'flex';
        }

        function closeSettingsModal() {
            document.getElementById('settings-modal').style.display = 'none';
        }

        function updateCustomization() {
            const radius = document.getElementById('radiusSetting').value;
            const neon = document.getElementById('neonSetting').value;
            const customFavicon = document.getElementById('customFaviconInput').value.trim();

            document.documentElement.style.setProperty('--card-radius', radius);
            document.documentElement.setAttribute('data-neon', neon);

            localStorage.setItem('aesthetic_radius', radius);
            localStorage.setItem('aesthetic_neon', neon);
            localStorage.setItem('aesthetic_custom_favicon', customFavicon);

            applyFavicon(customFavicon);
        }

        function renderShortcuts() {
            const container = document.getElementById('gridContainer');
            container.innerHTML = '';

            shortcuts.forEach((item, index) => {
                const card = document.createElement('a');
                card.href = item.url;
                card.target = "_blank";
                card.className = 'shortcut-card';
                card.dataset.id = item.id;
                card.style.animationDelay = `${index * 0.04}s`;

                const domain = new URL(item.url.startsWith('http') ? item.url : `https://` + item.url).hostname;
                const faviconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;

                card.innerHTML = `
                    <div class="shortcut-icon-wrapper">
                        <img src="${faviconUrl}" alt="${item.name}" onerror="this.src='https://www.google.com/s2/favicons?domain=example.com&sz=64'">
                    </div>
                    <span class="shortcut-title">${item.name}</span>
                `;

                card.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    currentTargetId = item.id;
                    const menu = document.getElementById('context-menu');
                    menu.style.display = 'block';
                    menu.style.left = `${e.pageX}px`;
                    menu.style.top = `${e.pageY}px`;
                });

                container.appendChild(card);
            });
        }

        function addShortcut() {
            const nameInput = document.getElementById('siteName');
            const urlInput = document.getElementById('siteUrl');

            let name = nameInput.value.trim();
            let url = urlInput.value.trim();

            if (!name || !url) return alert('Por favor, rellena ambos campos.');

            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            const newShortcut = {
                id: Date.now().toString(),
                name,
                url
            };

            shortcuts.push(newShortcut);
            saveAndRender();

            nameInput.value = '';
            urlInput.value = '';
        }

        window.addEventListener('click', (e) => {
            if (!e.target.closest('#context-menu')) {
                document.getElementById('context-menu').style.display = 'none';
            }
        });

        function deleteShortcut() {
            shortcuts = shortcuts.filter(s => s.id !== currentTargetId);
            document.getElementById('context-menu').style.display = 'none';
            saveAndRender();
        }

        function openEditModal() {
            document.getElementById('context-menu').style.display = 'none';
            const shortcut = shortcuts.find(s => s.id === currentTargetId);
            if (!shortcut) return;

            document.getElementById('editName').value = shortcut.name;
            document.getElementById('editUrl').value = shortcut.url;
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('edit-modal').style.display = 'none';
        }

        function saveEdit() {
            const shortcut = shortcuts.find(s => s.id === currentTargetId);
            if (!shortcut) return;

            const newName = document.getElementById('editName').value.trim();
            let newUrl = document.getElementById('editUrl').value.trim();

            if (!newName || !newUrl) return alert('Los campos no pueden estar vacíos.');

            if (!newUrl.startsWith('http://') && !newUrl.startsWith('https://')) {
                newUrl = 'https://' + newUrl;
            }

            shortcut.name = newName;
            shortcut.url = newUrl;

            closeEditModal();
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('aesthetic_shortcuts_v4', JSON.stringify(shortcuts));
            renderShortcuts();
        }

        renderShortcuts();
    </script>
</body>
</html>
