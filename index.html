<!DOCTYPE html>
<html lang="es" data-theme="dark" data-mode="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-main-title">Aesthetic Launchpad</title>
    <!-- Favicon predeterminado fijo -->
    <link rel="icon" href="https://material-icons.github.io/material-icons-png/png/black/link/baseline-4x.png">
    <style>
        /* --- VARIABLES DE TEMAS Y PERSONALIZACIÓN DINÁMICA --- */
        :root {
            --transition-speed: 0.4s;
            --card-radius: 20px;
            --card-min-width: 110px;
            --glow-effect: 0 15px 30px rgba(0, 0, 0, 0.25), 0 0 20px var(--accent-glow);
        }

        /* Tema: Dark Space */
        :root[data-theme="dark"][data-mode="dark"] {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #090d16 100%);
            --glass-bg: rgba(30, 41, 59, 0.85);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --card-hover: rgba(51, 65, 85, 0.9);
            --blob-color-1: rgba(99, 102, 241, 0.22);
            --blob-color-2: rgba(168, 85, 247, 0.18);
            --blob-color-3: rgba(56, 189, 248, 0.18);
        }
        :root[data-theme="dark"][data-mode="light"] {
            --bg-gradient: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 50%, #f1f5f9 100%);
            --glass-bg: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(0, 0, 0, 0.08);
            --text-main: #0f172a;
            --text-muted: #475569;
            --accent: #4f46e5;
            --accent-glow: rgba(79, 70, 229, 0.25);
            --card-hover: rgba(255, 255, 255, 1);
            --blob-color-1: rgba(99, 102, 241, 0.15);
            --blob-color-2: rgba(147, 51, 234, 0.12);
            --blob-color-3: rgba(14, 165, 233, 0.12);
        }

        /* Tema: Cyber Neon */
        :root[data-theme="neon"][data-mode="dark"] {
            --bg-gradient: linear-gradient(135deg, #050505 0%, #12001a 50%, #030712 100%);
            --glass-bg: rgba(20, 20, 30, 0.85);
            --glass-border: rgba(236, 72, 153, 0.35);
            --text-main: #fff;
            --text-muted: #cbd5e1;
            --accent: #ec4899;
            --accent-glow: rgba(236, 72, 153, 0.6);
            --card-hover: rgba(35, 30, 50, 0.95);
            --blob-color-1: rgba(236, 72, 153, 0.25);
            --blob-color-2: rgba(59, 130, 246, 0.18);
            --blob-color-3: rgba(168, 85, 247, 0.22);
        }
        :root[data-theme="neon"][data-mode="light"] {
            --bg-gradient: linear-gradient(135deg, #fce7f3 0%, #fae8ff 50%, #fbcfe8 100%);
            --glass-bg: rgba(255, 255, 255, 0.95);
            --glass-border: rgba(236, 72, 153, 0.25);
            --text-main: #701a75;
            --text-muted: #86198f;
            --accent: #db2777;
            --accent-glow: rgba(219, 39, 119, 0.3);
            --card-hover: rgba(255, 255, 255, 1);
            --blob-color-1: rgba(236, 72, 153, 0.18);
            --blob-color-2: rgba(217, 70, 239, 0.15);
            --blob-color-3: rgba(244, 114, 182, 0.18);
        }

        /* Tema: Clean Minimal */
        :root[data-theme="minimal"][data-mode="dark"] {
            --bg-gradient: linear-gradient(135deg, #121212 0%, #1e1e1e 50%, #0a0a0a 100%);
            --glass-bg: rgba(30, 30, 30, 0.85);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-main: #e5e5e5;
            --text-muted: #a3a3a3;
            --accent: #262626;
            --accent-glow: rgba(255, 255, 255, 0.15);
            --card-hover: rgba(45, 45, 45, 0.95);
            --blob-color-1: rgba(255, 255, 255, 0.1);
            --blob-color-2: rgba(115, 115, 115, 0.12);
            --blob-color-3: rgba(212, 212, 212, 0.08);
        }
        :root[data-theme="minimal"][data-mode="light"] {
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 50%, #e2e8f0 100%);
            --glass-bg: rgba(255, 255, 255, 0.95);
            --glass-border: rgba(0, 0, 0, 0.08);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #0284c7;
            --accent-glow: rgba(2, 132, 199, 0.2);
            --card-hover: rgba(255, 255, 255, 1);
            --blob-color-1: rgba(2, 132, 199, 0.12);
            --blob-color-2: rgba(56, 189, 248, 0.12);
            --blob-color-3: rgba(148, 163, 184, 0.15);
        }

        /* Tema: Sunset Vibes */
        :root[data-theme="sunset"][data-mode="dark"] {
            --bg-gradient: linear-gradient(135deg, #2a0845 0%, #6441a5 50%, #1a052e 100%);
            --glass-bg: rgba(50, 30, 70, 0.8);
            --glass-border: rgba(255, 150, 150, 0.25);
            --text-main: #fff5f5;
            --text-muted: #f3cbd3;
            --accent: #ff758c;
            --accent-glow: rgba(255, 117, 140, 0.5);
            --card-hover: rgba(70, 45, 95, 0.9);
            --blob-color-1: rgba(255, 117, 140, 0.22);
            --blob-color-2: rgba(251, 146, 60, 0.18);
            --blob-color-3: rgba(236, 72, 153, 0.2);
        }
        :root[data-theme="sunset"][data-mode="light"] {
            --bg-gradient: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 50%, #ffd1dc 100%);
            --glass-bg: rgba(255, 255, 255, 0.95);
            --glass-border: rgba(255, 117, 140, 0.35);
            --text-main: #581c87;
            --text-muted: #7e22ce;
            --accent: #e11d48;
            --accent-glow: rgba(225, 29, 72, 0.25);
            --card-hover: rgba(255, 255, 255, 1);
            --blob-color-1: rgba(255, 117, 140, 0.2);
            --blob-color-2: rgba(251, 113, 133, 0.18);
            --blob-color-3: rgba(244, 63, 94, 0.15);
        }

        /* Tema: Emerald Matrix */
        :root[data-theme="emerald"][data-mode="dark"] {
            --bg-gradient: linear-gradient(135deg, #022c22 0%, #064e3b 50%, #021a14 100%);
            --glass-bg: rgba(6, 78, 59, 0.85);
            --glass-border: rgba(52, 211, 153, 0.25);
            --text-main: #ecfdf5;
            --text-muted: #a7f3d0;
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.4);
            --card-hover: rgba(4, 120, 87, 0.9);
            --blob-color-1: rgba(16, 185, 129, 0.22);
            --blob-color-2: rgba(52, 211, 153, 0.18);
            --blob-color-3: rgba(5, 150, 105, 0.2);
        }
        :root[data-theme="emerald"][data-mode="light"] {
            --bg-gradient: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 50%, #a7f3d0 100%);
            --glass-bg: rgba(255, 255, 255, 0.95);
            --glass-border: rgba(16, 185, 129, 0.25);
            --text-main: #064e3b;
            --text-muted: #047857;
            --accent: #059669;
            --accent-glow: rgba(5, 150, 105, 0.25);
            --card-hover: rgba(255, 255, 255, 1);
            --blob-color-1: rgba(16, 185, 129, 0.18);
            --blob-color-2: rgba(74, 222, 128, 0.15);
            --blob-color-3: rgba(52, 211, 153, 0.15);
        }

        /* Tema: Golden Amber */
        :root[data-theme="amber"][data-mode="dark"] {
            --bg-gradient: linear-gradient(135deg, #1c1917 0%, #292524 50%, #0c0a09 100%);
            --glass-bg: rgba(41, 37, 36, 0.85);
            --glass-border: rgba(245, 158, 11, 0.3);
            --text-main: #fef3c7;
            --text-muted: #d7d3d0;
            --accent: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.4);
            --card-hover: rgba(68, 64, 60, 0.9);
            --blob-color-1: rgba(245, 158, 11, 0.22);
            --blob-color-2: rgba(251, 191, 36, 0.18);
            --blob-color-3: rgba(217, 119, 6, 0.2);
        }
        :root[data-theme="amber"][data-mode="light"] {
            --bg-gradient: linear-gradient(135deg, #fef3c7 0%, #fde68a 50%, #fef9c3 100%);
            --glass-bg: rgba(255, 255, 255, 0.95);
            --glass-border: rgba(245, 158, 11, 0.25);
            --text-main: #78350f;
            --text-muted: #92400e;
            --accent: #d97706;
            --accent-glow: rgba(217, 119, 6, 0.25);
            --card-hover: rgba(255, 255, 255, 1);
            --blob-color-1: rgba(245, 158, 11, 0.18);
            --blob-color-2: rgba(252, 211, 77, 0.15);
            --blob-color-3: rgba(245, 158, 11, 0.15);
        }

        /* --- ESTILOS GENERALES Y ANIMACIÓN DE FONDO --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        body {
            background: var(--bg-gradient);
            background-size: 250% 250%;
            animation: backgroundLoop 18s ease infinite;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            transition: color var(--transition-speed) ease;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes backgroundLoop {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Capa de formas/luces flotantes de fondo (dinámica para ambos modos) */
        .background-blobs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            animation: floatBlob 12s ease-in-out infinite alternate;
        }

        .blob-1 {
            width: 400px;
            height: 400px;
            top: -100px;
            left: -100px;
            background: var(--blob-color-1);
            animation-duration: 14s;
        }

        .blob-2 {
            width: 500px;
            height: 500px;
            bottom: -150px;
            right: -150px;
            background: var(--blob-color-2);
            animation-duration: 18s;
            animation-delay: -3s;
        }

        .blob-3 {
            width: 300px;
            height: 300px;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--blob-color-3);
            animation-duration: 10s;
            animation-delay: -6s;
        }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, 30px) scale(1.1); }
            100% { transform: translate(-30px, 50px) scale(0.95); }
        }

        header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            animation: slideDown 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px var(--accent-glow);
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
        }

        h1:hover {
            opacity: 0.85;
            transform: scale(1.01);
        }

        .header-controls {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .theme-selector select, .control-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 12px;
            outline: none;
            cursor: pointer;
            backdrop-filter: blur(16px);
            transition: 0.3s;
        }

        .theme-selector select:hover, .control-btn:hover {
            border-color: var(--accent);
            transform: translateY(-2px) scale(1.03);
        }

        .control-btn {
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            padding: 0;
        }

        /* --- FORMULARIO --- */
        .card-form {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(16px);
            padding: 1.5rem;
            border-radius: var(--card-radius);
            width: 100%;
            max-width: 900px;
            display: flex;
            gap: 1rem;
            margin-bottom: 2.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            animation: fadeInScale 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1;
        }

        .card-form input {
            flex: 1;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 0.75rem 1rem;
            border-radius: 12px;
            color: var(--text-main);
            outline: none;
            font-size: 0.95rem;
            transition: 0.3s;
        }

        .card-form input::placeholder {
            color: var(--text-muted);
        }

        .card-form input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
            transform: scale(1.01);
        }

        .card-form button {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .card-form button:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        /* --- GRID DE ACCESOS --- */
        .grid-container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--card-min-width), 1fr));
            gap: 1.5rem;
            z-index: 1;
        }

        .shortcut-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(16px);
            border-radius: var(--card-radius);
            padding: 1.1rem 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            cursor: grab;
            text-decoration: none;
            color: var(--text-main);
            position: relative;
            overflow: hidden;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s, border-color 0.3s, box-shadow 0.3s, opacity 0.2s;
            animation: cardPopIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
        }

        .shortcut-card:active {
            cursor: grabbing;
        }

        .shortcut-card.dragging {
            opacity: 0.4;
            transform: scale(0.9);
        }

        .shortcut-card.drag-over {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
            transform: scale(1.08);
        }

        .shortcut-card:hover {
            transform: translateY(-8px) scale(1.05);
            background: var(--card-hover);
            border-color: var(--accent);
            box-shadow: var(--glow-effect);
        }

        .shortcut-icon-wrapper {
            width: 52px;
            height: 52px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: calc(var(--card-radius) - 6px);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: transform 0.3s ease;
            pointer-events: none;
        }

        .shortcut-card:hover .shortcut-icon-wrapper {
            transform: rotate(6deg) scale(1.12);
        }

        .shortcut-card img {
            width: 30px;
            height: 30px;
            object-fit: contain;
            border-radius: 4px;
            pointer-events: none;
        }

        .shortcut-title {
            font-size: 0.85rem;
            font-weight: 500;
            text-align: center;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 0.5rem;
            pointer-events: none;
        }

        /* --- MENÚ CONTEXTUAL --- */
        #context-menu {
            display: none;
            position: absolute;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 1000;
            padding: 0.4rem;
            min-width: 140px;
            color: var(--text-main);
            animation: popInMenu 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .menu-item {
            padding: 0.5rem 0.75rem;
            font-size: 0.85rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, transform 0.1s;
            color: var(--text-main);
        }

        .menu-item:hover {
            background: var(--accent);
            color: #fff;
            transform: translateX(3px);
        }

        .menu-item.delete:hover {
            background: #ef4444;
        }

        /* --- ZONA DE AJUSTES --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.25s ease;
        }

        .settings-modal-box {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            padding: 2rem;
            border-radius: var(--card-radius);
            width: 90%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
            animation: scaleUpModal 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            color: var(--text-main);
        }

        .settings-modal-box h3 {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.3px;
        }

        .settings-field-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .settings-field-group label {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .settings-field-group select, .settings-field-group input[type="text"] {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 0.75rem 1rem;
            border-radius: 12px;
            outline: none;
            font-size: 0.95rem;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .settings-field-group input[type="text"] {
            cursor: text;
        }

        /* Estilo para el input de tipo rango (barra deslizable) */
        .settings-field-group input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            background: var(--glass-border);
            border-radius: 4px;
            outline: none;
            margin-top: 0.5rem;
        }

        .settings-field-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 0 10px var(--accent-glow);
            transition: transform 0.2s;
        }

        .settings-field-group input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .settings-field-group select:focus, .settings-field-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .settings-field-group select option {
            background-color: var(--glass-bg);
            color: var(--text-main);
        }

        .settings-action-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 0.75rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 12px var(--accent-glow);
            text-align: center;
        }

        .settings-action-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px var(--accent-glow);
        }

        /* --- ANIMACIONES EXTRA --- */
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.92) translateY(-10px); }
            to { opacity: 1; transform: scale(1); translateY(0); }
        }

        @keyframes cardPopIn {
            0% { opacity: 0; transform: scale(0.7) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes popInMenu {
            from { opacity: 0; transform: scale(0.9) translateY(-5px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes scaleUpModal {
            from { opacity: 0; transform: scale(0.85) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        @media (max-width: 600px) {
            .card-form {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <!-- Capa de animación de fondo en bucle suave -->
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <header>
        <h1 id="mainTitleDisplay" onclick="changeAppTitle()" title="Haz clic para editar el título">
            <span id="titleText">Aesthetic Launchpad</span>
        </h1>
        <div class="header-controls">
            <div class="theme-selector">
                <select id="themeSelect" onchange="changeTheme(this.value)">
                    <option value="dark">Dark Space</option>
                    <option value="neon">Cyber Neon</option>
                    <option value="minimal">Clean Minimal</option>
                    <option value="sunset">Sunset Vibes</option>
                    <option value="emerald">Emerald Matrix</option>
                    <option value="amber">Golden Amber</option>
                </select>
            </div>
            <button class="control-btn" onclick="openSettingsModal()" title="Personalización Avanzada">⚙️</button>
            <button class="control-btn" id="modeBtn" onclick="toggleMode()" title="Cambiar Modo Claro/Oscuro">🌙</button>
        </div>
    </header>

    <!-- Formulario para añadir -->
    <div class="card-form">
        <input type="text" id="siteName" placeholder="Nombre personalizado (ej. Mi Web)">
        <input type="text" id="siteUrl" placeholder="Enlace (ej. https://ejemplo.com)">
        <button onclick="addShortcut()">Añadir</button>
    </div>

    <!-- Contenedor de Botones -->
    <div class="grid-container" id="gridContainer"></div>

    <!-- Menú contextual (Clic Derecho) -->
    <div id="context-menu">
        <div class="menu-item" onclick="openEditModal()">Editar Web...</div>
        <div class="menu-item delete" onclick="deleteShortcut()">Eliminar</div>
    </div>

    <!-- Modal de Edición de Acceso Directo -->
    <div id="edit-modal" class="modal-overlay">
        <div class="settings-modal-box">
            <h3>Editar Acceso Directo</h3>
            <div class="settings-field-group">
                <label>Nombre</label>
                <input type="text" id="editName" placeholder="Nuevo nombre">
            </div>
            <div class="settings-field-group">
                <label>Enlace</label>
                <input type="text" id="editUrl" placeholder="Nuevo enlace">
            </div>
            <div style="display: flex; gap: 0.75rem; margin-top: 0.5rem;">
                <button class="settings-action-btn" style="background: rgba(128,128,128,0.2); color: var(--text-main);" onclick="closeEditModal()">Cancelar</button>
                <button class="settings-action-btn" onclick="saveEdit()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Zona de Ajustes -->
    <div id="settings-modal" class="modal-overlay">
        <div class="settings-modal-box">
            <h3>Ajustes Aesthetic</h3>
            <div class="settings-field-group">
                <label>Redondeo de Tarjetas (Bordes)</label>
                <select id="radiusSetting" onchange="updateCustomization()">
                    <option value="12px">Sutil (12px)</option>
                    <option value="20px">Moderno (20px)</option>
                    <option value="32px">Redondo (32px)</option>
                    <option value="50px">Cápsula (50px)</option>
                </select>
            </div>
            <div class="settings-field-group">
                <label>Tamaño de Botones <span id="sizeValueDisplay" style="color: var(--accent);">110px</span></label>
                <input type="range" id="sizeSetting" min="85" max="160" value="110" oninput="updateCustomization()" onchange="updateCustomization()">
            </div>
            <button class="settings-action-btn" onclick="closeSettingsModal()">¡Listo!</button>
        </div>
    </div>

    <script>
        let shortcuts = JSON.parse(localStorage.getItem('aesthetic_shortcuts_v7')) || [];
        let currentTargetId = null;
        let draggedIndex = null;

        // Cargar preferencias guardadas
        const savedTheme = localStorage.getItem('aesthetic_theme') || 'dark';
        const savedMode = localStorage.getItem('aesthetic_mode') || 'dark';
        const savedTitle = localStorage.getItem('aesthetic_app_title') || 'Aesthetic Launchpad';
        const savedRadius = localStorage.getItem('aesthetic_radius') || '20px';
        const savedSize = localStorage.getItem('aesthetic_card_size') || '110px';

        document.documentElement.setAttribute('data-theme', savedTheme);
        document.documentElement.setAttribute('data-mode', savedMode);
        document.documentElement.style.setProperty('--card-radius', savedRadius);
        document.documentElement.style.setProperty('--card-min-width', savedSize);

        document.getElementById('themeSelect').value = savedTheme;
        document.getElementById('titleText').textContent = savedTitle;
        document.getElementById('page-main-title').textContent = savedTitle;
        document.getElementById('radiusSetting').value = savedRadius;
        
        const numericSize = parseInt(savedSize);
        document.getElementById('sizeSetting').value = numericSize;
        document.getElementById('sizeValueDisplay').textContent = savedSize;

        updateModeButtonIcon(savedMode);

        function changeTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('aesthetic_theme', theme);
        }

        function toggleMode() {
            const currentMode = document.documentElement.getAttribute('data-mode');
            const newMode = currentMode === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-mode', newMode);
            localStorage.setItem('aesthetic_mode', newMode);
            updateModeButtonIcon(newMode);
        }

        function updateModeButtonIcon(mode) {
            document.getElementById('modeBtn').textContent = mode === 'dark' ? '🌙' : '☀️';
        }

        function changeAppTitle() {
            const newTitle = prompt("Introduce el nuevo nombre para tu Launchpad:", document.getElementById('titleText').textContent);
            if (newTitle !== null && newTitle.trim() !== "") {
                const cleanTitle = newTitle.trim();
                document.getElementById('titleText').textContent = cleanTitle;
                document.getElementById('page-main-title').textContent = cleanTitle;
                localStorage.setItem('aesthetic_app_title', cleanTitle);
            }
        }

        function openSettingsModal() {
            document.getElementById('settings-modal').style.display = 'flex';
        }

        function closeSettingsModal() {
            document.getElementById('settings-modal').style.display = 'none';
        }

        function updateCustomization() {
            const radius = document.getElementById('radiusSetting').value;
            const sizeVal = document.getElementById('sizeSetting').value + 'px';

            document.documentElement.style.setProperty('--card-radius', radius);
            document.documentElement.style.setProperty('--card-min-width', sizeVal);
            document.getElementById('sizeValueDisplay').textContent = sizeVal;

            localStorage.setItem('aesthetic_radius', radius);
            localStorage.setItem('aesthetic_card_size', sizeVal);
        }

        function renderShortcuts() {
            const container = document.getElementById('gridContainer');
            container.innerHTML = '';

            shortcuts.forEach((item, index) => {
                const card = document.createElement('a');
                card.href = item.url;
                card.target = "_blank";
                card.className = 'shortcut-card';
                card.dataset.id = item.id;
                card.draggable = true;
                card.style.animationDelay = `${index * 0.04}s`;

                const domain = new URL(item.url.startsWith('http') ? item.url : `https://` + item.url).hostname;
                const faviconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;

                card.innerHTML = `
                    <div class="shortcut-icon-wrapper">
                        <img src="${faviconUrl}" alt="${item.name}" onerror="this.src='https://www.google.com/s2/favicons?domain=example.com&sz=64'">
                    </div>
                    <span class="shortcut-title">${item.name}</span>
                `;

                // Eventos de Arrastrar y Soltar (Drag and Drop)
                card.addEventListener('dragstart', (e) => {
                    draggedIndex = index;
                    setTimeout(() => card.classList.add('dragging'), 0);
                });

                card.addEventListener('dragend', () => {
                    card.classList.remove('dragging');
                    document.querySelectorAll('.shortcut-card').forEach(c => c.classList.remove('drag-over'));
                });

                card.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    card.classList.add('drag-over');
                });

                card.addEventListener('dragleave', () => {
                    card.classList.remove('drag-over');
                });

                card.addEventListener('drop', (e) => {
                    e.preventDefault();
                    card.classList.remove('drag-over');
                    if (draggedIndex !== null && draggedIndex !== index) {
                        const temp = shortcuts[draggedIndex];
                        shortcuts[draggedIndex] = shortcuts[index];
                        shortcuts[index] = temp;
                        saveAndRender();
                    }
                });

                card.addEventListener('click', (e) => {
                    if (card.classList.contains('dragging')) {
                        e.preventDefault();
                    }
                });

                card.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    currentTargetId = item.id;
                    const menu = document.getElementById('context-menu');
                    menu.style.display = 'block';
                    menu.style.left = `${e.pageX}px`;
                    menu.style.top = `${e.pageY}px`;
                });

                container.appendChild(card);
            });
        }

        function addShortcut() {
            const nameInput = document.getElementById('siteName');
            const urlInput = document.getElementById('siteUrl');

            let name = nameInput.value.trim();
            let url = urlInput.value.trim();

            if (!name || !url) return alert('Por favor, rellena ambos campos.');

            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            const newShortcut = {
                id: Date.now().toString(),
                name,
                url
            };

            shortcuts.push(newShortcut);
            saveAndRender();

            nameInput.value = '';
            urlInput.value = '';
        }

        window.addEventListener('click', (e) => {
            if (!e.target.closest('#context-menu')) {
                document.getElementById('context-menu').style.display = 'none';
            }
        });

        function deleteShortcut() {
            shortcuts = shortcuts.filter(s => s.id !== currentTargetId);
            document.getElementById('context-menu').style.display = 'none';
            saveAndRender();
        }

        function openEditModal() {
            document.getElementById('context-menu').style.display = 'none';
            const shortcut = shortcuts.find(s => s.id === currentTargetId);
            if (!shortcut) return;

            document.getElementById('editName').value = shortcut.name;
            document.getElementById('editUrl').value = shortcut.url;
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('edit-modal').style.display = 'none';
        }

        function saveEdit() {
            const shortcut = shortcuts.find(s => s.id === currentTargetId);
            if (!shortcut) return;

            const newName = document.getElementById('editName').value.trim();
            let newUrl = document.getElementById('editUrl').value.trim();

            if (!newName || !newUrl) return alert('Los campos no pueden estar vacíos.');

            if (!newUrl.startsWith('http://') && !newUrl.startsWith('https://')) {
                newUrl = 'https://' + newUrl;
            }

            shortcut.name = newName;
            shortcut.url = newUrl;

            closeEditModal();
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('aesthetic_shortcuts_v7', JSON.stringify(shortcuts));
            renderShortcuts();
        }

        renderShortcuts();
    </script>
</body>
</html>
